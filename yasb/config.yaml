      width: 100%
      height: 35
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        - komorebi_stack
        - komorebi_active_layout
        - komorebi_workspaces
        - quick_launch
        - taskbar
        - active_window
      center:
        - clock
        - audio_visualizer
        - media
        - weather
      right:
        - bluetooth
        - systray
        - volume
        - control_center
